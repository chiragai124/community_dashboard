name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Node the project was developed and verified against.
          node-version: '22'
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly the committed
      # lockfile and fails if package.json and the lockfile have drifted.
      - name: Install dependencies
        run: npm ci

      # A debugging stub — `await new Promise(() => {})` — once shipped to main
      # and hung the Sheets integration on every render. It typechecks and
      # builds cleanly, so only an explicit check catches it.
      - name: No debug stubs
        run: npm run check:stubs

      - name: Typecheck
        run: npm run typecheck

      # Also runs Next's own type checking across routes and server components.
      - name: Build
        run: npm run build
